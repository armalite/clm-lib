# Experiment 005 configuration (harder coding task, invoice-gen/2): experiment 004's settings
# (token-tail/1 baseline, 8K whole-request budget, same model/effort, max_output_tokens 4096)
# except max_calls 45 (6-8 requirement stages instead of 4), min_run_reserve_usd 1.50, and the
# ledger ceiling authorised for this experiment (spend at start USD 16.213524 + USD 30).
# Prompt caching is not used (no cache_control is sent).
# All limits are recorded in every run and shared by both arms.
# Use only this config for experiment-005 live commands: a config with a lower ceiling (for
# example exp004.toml) would lower the stored ledger ceiling.
runs_dir = "runs"

[provider]
name = "anthropic"
model = "claude-opus-5-5"     # verified via the models endpoint by `clm-lib doctor --probe`
base_url = ""                 # empty: SDK default (or ANTHROPIC_BASE_URL)
effort = "low"                # output_config.effort; thinking cannot be disabled on this model
structured_output = true      # output_config.format json_schema for actions
timeout_s = 120
api_retries = 2               # runtime-level retries; SDK retries are disabled

[limits]
max_calls = 45                # per task: actions + repairs + summaries + API retries
max_output_tokens = 4096
exec_timeout_s = 30
output_cap_chars = 6000       # per stream
context_budget_tokens = 8000  # whole request input
pressure_ratio = 0.70
recovery_reserve_tokens = 1000
spill_min_chars = 1500
initial_chars_per_token = 3.0
max_code_chars = 20000

[baseline]
policy = "token-tail/1"     # experiment 003; experiments 001/002 used "fixed-tail/1"
tail_entries = 4
summary_max_chars = 3000
summary_retries = 1
tail_ratio = 0.15            # token-tail/1: verbatim recent-entry allowance (fraction of budget)
newest_ratio = 0.25          # token-tail/1: newest entry kept verbatim if it fits this fraction
target_ratio = 0.50          # token-tail/1: desired request size after compaction
summary_min_chars = 600

[budget]
ceiling_usd = 46.213524            # total live-validation ceiling; ledger keeps the lowest ever set
min_run_reserve_usd = 1.50    # compare: do not start a run with less remaining
ledger = "runs/ledger.json"
prices = "configs/prices.toml"

[sandbox]
image = "python:3.12-slim"
memory = "512m"
cpus = 1.0
pids_limit = 128
